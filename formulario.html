    <div class="contenedor">
        <h1>Formulario de Registro</h1>

        <form id="formulario" novalidate>

            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" maxlength="100"
                    placeholder="Escribe tu nombre">
                <small class="mensaje" id="errorNombre"></small>
            </div>

            <div class="campo">
                <label for="paterno">Apellido paterno:</label>
                <input type="text" id="paterno" maxlength="100"
                    placeholder="Escribe tu apellido paterno">
                <small class="mensaje" id="errorPaterno"></small>
            </div>

            <div class="campo">
                <label for="materno">Apellido materno:</label>
                <input type="text" id="materno" maxlength="100"
                    placeholder="Escribe tu apellido materno">
                <small class="mensaje" id="errorMaterno"></small>
            </div>

            <div class="campo">
                <label for="edad">Edad:</label>
                <input type="text" id="edad" maxlength="3"
                    inputmode="numeric" placeholder="Ejemplo: 25">
                <small class="mensaje" id="errorEdad"></small>
            </div>

            <div class="campo">
                <label for="telefono">Numero de Cuenta:</label>
                <input type="text" id="telefono" maxlength="16" minlength="16" 
                    inputmode="numeric" placeholder="16 dígitos"
                    oninput="this.value=this.value.replace(/[^0-9]/g, '').slice(0,16)"">
                <small class="mensaje" id="errorTelefono"></small>
            </div>

             <div class="campo">
                <label for="fecha">Fecha de Nacimiento:</label>
                <input type="date" id="fecha"> 
                <small class="mensaje" id="errorCuenta"></small>
            </div>


            <div class="campo">
                <label for="gmail">Correo electrónico:</label>
                <input type="text" id="gmail"
                    placeholder="ejemplo@gmail.com">
                <small class="mensaje" id="errorGmail"></small>
            </div>

            <button type="submit">VALIDAR</button>


            <div id="resultado"></div>

        </form>
    </div>
        <script src="validaciones.js"></script>
    
</body>
</html>
